name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          rebar3-version: "3.27"

      - name: Cache rebar3 dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-rebar3-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-rebar3-

      - uses: dtolnay/rust-toolchain@stable

      # build_nif.sh sets the symbolic_nlp NIF's rpath to its libtorch
      # with patchelf on Linux (the install_name_tool step is macOS-only);
      # without it the NIF builds but cannot dlopen libtorch at test
      # time, and the statistical tier's tests degrade instead of run.
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/symbolic_ts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/symbolic_ts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compile (includes the symbolic_ts Rustler NIF via the compile pre-hook)
        run: rebar3 compile

      # The statistical tier's first tag call downloads its ~94MB POS
      # model; inside eunit that exceeds the per-test timeout and
      # cancels the run. Warm it here, and cache it so later runs skip
      # the download entirely.
      - name: Cache the tagger model
        uses: actions/cache@v4
        with:
          path: ~/.cache/rustbert
          key: ${{ runner.os }}-rustbert-v1

      - name: Warm the tagger model
        run: erl -noshell -pa _build/*/lib/*/ebin -eval 'case symbolic_nlp:tag(<<"warm the model cache">>) of {ok, _} -> halt(0); _ -> halt(1) end.'

      - name: Run EUnit tests
        run: rebar3 eunit
