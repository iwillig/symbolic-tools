<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The project's mark: a Prolog prompt, "?-", on a rounded square.
       The gradient runs between Pico CSS's own primary color (#0172ad)
       and its hover shade (#015887): on brand by construction, not a
       color picked to match. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c8fd6"/>
      <stop offset="1" stop-color="#015887"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <text x="16.5" y="22.5" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" font-weight="800" letter-spacing="-0.5" fill="#ffffff">?-</text>
</svg>
