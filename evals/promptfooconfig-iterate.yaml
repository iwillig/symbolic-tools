# A/B/C/D experiment: does the query tool's doc string steer correct Prolog goals?
# Only the query description and its goal param differ between providers.
prompts:
  - id: file://prompts/symbolic_mcp_cached.json
    label: cached

providers:
  - id: huggingface:chat:Qwen/Qwen3.8-27B
    label: "A no-schema bad-example"
    config:
      inferenceProvider: novita
      temperature: 0
      max_new_tokens: 2048
      showThinking: false
      tools:
        - type: function
          function:
            name: mcp__symbolic__parse
            description: 'Parse a directory and cache its codebase facts in memory. Call before any query in a new session.'
            parameters:
              type: object
              properties:
                path:
                  type: string
                  description: 'Project root or plain source directory to scan'
        - type: function
          function:
            name: mcp__symbolic__query
            description: "Prove a Prolog goal against a cached codebase and return all solutions (capped)."
            parameters:
              type: object
              required: [goal]
              properties:
                goal:
                  type: string
                  description: "Prolog goal, e.g. calls(X, local(foo), _, _)"
                limit:
                  type: integer
                  description: 'Max solutions to return (default 50)'
        - type: function
          function:
            name: mcp__symbolic__overview
            description: 'Report the current state of a cached fact base: whether a codebase is loaded, how many files/languages, and fact counts by predicate.'
            parameters:
              type: object
              properties:
                path:
                  type: string
                  description: 'Which cached directory to report on'
        - type: function
          function:
            name: mcp__symbolic__ask
            description: 'Answer a bounded English question against a cached codebase.'
            parameters:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  description: 'The question'
