          try { goal = JSON.parse(tc.function.arguments).goal || ''; } catch (e) { return false; }
          return /(duplicate_name|defines)\s*\(/.test(goal) && /line/.test(goal);

  - description: 'trace evals premise (Oct 8) - claim TRUE - parse/2 in symbolic_codebase.erl'
    vars:
      claim: >-
        Claim from a past session: "parse/2, the function that loads a codebase into the cache,
