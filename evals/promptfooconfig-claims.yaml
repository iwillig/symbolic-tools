  - description: 'trace 97eac5c7 L105 (Sep 23) - claim TRUE - line/1 duplicated across extractors'
    vars:
      claim: >-
        Claim from a past session: "line/1 is byte-for-byte identical in ts_extract_erlang.erl,
        ts_extract_typescript.erl, and ts_extract_bash.erl - the same function name is duplicated
        across files." Verify that line/1 is a duplicated function name in this codebase.
    assert:
      - type: is-valid-openai-tools-call
      - type: tool-call-f1
        value: [mcp__symbolic__query]
        threshold: 0.5
      - type: javascript
        value: |
          const list = Array.isArray(output) ? output : (output && Array.isArray(output.tool_calls) ? output.tool_calls : []);
          const tc = list.find(c => c && c.function && c.function.name === 'mcp__symbolic__query');
