          try { goal = JSON.parse(tc.function.arguments).goal || ''; } catch (e) { return false; }
          return /\b(calls|callers)\s*\(/.test(goal) && /to_atom/.test(goal);

  - description: 'trace 19148384 L146 (Sep 24) - claim FALSE - no dead code in src/'
    vars:
      claim: >-
        Claim from a past session: "this codebase is architecturally clean, with zero dead code:
        no function in src/ is uncalled." Verify whether any function under src/ is truly
        uncalled.
    assert:
      - type: is-valid-openai-tools-call
      - type: tool-call-f1
        value: [mcp__symbolic__query]
        threshold: 0.5
      - type: javascript
        value: |
          const list = Array.isArray(output) ? output : (output && Array.isArray(output.tool_calls) ? output.tool_calls : []);
          const tc = list.find(c => c && c.function && c.function.name === 'mcp__symbolic__query');
